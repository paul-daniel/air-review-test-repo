# Azure Pipelines: air-review as a pull-request reviewer (build validation).
#
# Attach this pipeline to the target branch as a *build validation* policy
# (Project settings → Repositories → Policies → Branch policies).
#
# How the steps relate, like a human reviewer would work:
#   1. "Air Review" reviews early, on every push, only what changed since the
#      last reviewed commit. It comments in the pull request and votes
#      "waiting for author" when a blocking finding is open (exit code 10,
#      which fails this step).
#   2. Your own build and tests run (put your real steps there).
#   3. "Approve" runs only if the review, the build and the tests all
#      succeeded, and casts the approving vote. It never completes the PR.
# Exit codes 20/30/40/50 are tool or infrastructure errors; the log says why.
#
# Variable group `air-review` (Pipelines → Library):
#   AIR_REVIEW_PROVIDER              azure-foundry
#   AIR_REVIEW_BASE_URL              https://<resource>.services.ai.azure.com
#   AIR_REVIEW_MODEL_TRIAGE          <cheap deployment, e.g. gpt-5-mini or claude-haiku-4-5>
#   AIR_REVIEW_MODEL_REVIEWER        <standard deployment>
#   AIR_REVIEW_MODEL_VERIFIER        <cheap deployment>
#   AIR_REVIEW_MODEL_REVIEWER_LIGHT  <cheap deployment>
#   AIR_REVIEW_MODEL_REVIEWER_HEAVY  <strong deployment, e.g. gpt-5 or claude-sonnet-4-5>
#   AIR_REVIEW_PRICING               {"<deployment>":{"input":..,"cachedInput":..,"output":..}}
#   AIR_REVIEW_API_KEY  (secret)     Foundry API key — or use the AzureCLI step below for keyless Entra ID
#   AIR_REVIEW_PUBLISH               optional; `false` = review and report, but post nothing to the PR
#                                    (while the pipeline identity lacks "Contribute to pull requests")
# The review steps run in pull-request builds (branch policy), or in a manual
# run given a pull request id (Run pipeline → Branch = the PR's source branch →
# parameter "Pull request id"): for projects where you cannot add the policy.
# A manual run without that id just builds and tests.
# Claude deployments are recognised by their name (claude-…) or with the prefix claude:<deployment>.

trigger: none # run from the branch policy (Azure Repos ignores a `pr:` trigger), not on push

parameters:
  - name: pullRequestId
    displayName: Pull request id (manual run without a branch policy; 0 = none)
    type: number
    default: 0

pool:
  vmImage: ubuntu-latest # Microsoft-hosted agents; without hosted parallelism use a self-hosted pool: `name: Default`

variables:
  - group: air-review

steps:
  - checkout: self
    fetchDepth: 0 # full history: the diff is computed locally from the merge base
    persistCredentials: true

  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: Use Node 22

  # Installed in an isolated folder of the agent (a global install leaves state
  # behind between runs on self-hosted agents); the folder is then put on PATH.
  - script: |
      set -e
      dir="$(Agent.TempDirectory)/air-review"
      rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
      npm init -y >/dev/null
      npm install github:paul-daniel/air-review-poc --no-audit --no-fund
      echo "##vso[task.prependpath]$dir/node_modules/.bin"
    displayName: Install air-review
    condition: and(succeeded(), or(eq(variables['Build.Reason'], 'PullRequest'), ne(${{ parameters.pullRequestId }}, 0)))

  # Optional, keyless Foundry access through a service connection (Microsoft Entra ID).
  # With this step you can leave AIR_REVIEW_API_KEY empty. The identity needs the
  # "Azure AI User" role on the Foundry resource.
  # - task: AzureCLI@2
  #   displayName: Sign in to Azure for air-review
  #   inputs:
  #     azureSubscription: <service connection>
  #     scriptType: bash
  #     scriptLocation: inlineScript
  #     inlineScript: |
  #       token=$(az account get-access-token --scope https://ai.azure.com/.default --query accessToken -o tsv)
  #       echo "##vso[task.setvariable variable=AIR_REVIEW_ACCESS_TOKEN;issecret=true]$token"

  - script: |
      if [ "${{ parameters.pullRequestId }}" != "0" ]; then
        # Manual run: make sure the target branch is present locally for the diff.
        git fetch --quiet origin "+refs/heads/*:refs/remotes/origin/*"
        set -- --pr "${{ parameters.pullRequestId }}"
      fi
      air-review review --publish --plain "$@"
    displayName: Air Review
    condition: and(succeeded(), or(eq(variables['Build.Reason'], 'PullRequest'), ne(${{ parameters.pullRequestId }}, 0)))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken) # the job token: comments and votes as the build service
      AIR_REVIEW_API_KEY: $(AIR_REVIEW_API_KEY) # secret variables are never exported to scripts by default

  - publish: $(Build.SourcesDirectory)/.air-review/reports
    artifact: air-review-reports
    condition: and(succeededOrFailed(), or(eq(variables['Build.Reason'], 'PullRequest'), ne(${{ parameters.pullRequestId }}, 0)))
    continueOnError: true # no report when the review could not start; never fail the job for that
    displayName: Keep the run report (cost per step, workflow diagram)

  # ---- Your own quality steps go here (keep what your project really has). ----
  - script: echo "npm ci && npm run build"
    displayName: Build
  - script: echo "npm test"
    displayName: Tests

  # Approval: only when the review, the build and the tests succeeded.
  - script: |
      if [ "${{ parameters.pullRequestId }}" != "0" ]; then set -- --pr "${{ parameters.pullRequestId }}"; fi
      air-review approve --plain "$@"
    displayName: Approve the pull request
    condition: and(succeeded(), or(eq(variables['Build.Reason'], 'PullRequest'), ne(${{ parameters.pullRequestId }}, 0)))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
